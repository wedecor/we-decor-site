name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  repo-secrets-scan:
    name: Repository secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Fail if env files are tracked
        run: |
          set -e
          for f in .env .env.local .env.production .env.development .env.test; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::Tracked secret file: $f — run: git rm --cached $f"
              exit 1
            fi
          done

      - name: npm run verify:secrets
        run: npm run verify:secrets

      - name: Validate env schema (no secrets required in CI)
        run: npm run verify:env
        env:
          NEXT_PUBLIC_SITE_URL: https://www.wedecorevents.com
